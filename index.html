<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>עו"ד ורו"ח אסף ברקוביץ — ניהול תיקים ומועדים</title>
<style>
  body { font-family: 'Segoe UI', Arial, sans-serif; background: linear-gradient(135deg, #1A3260, #2A5298);
    color: #fff; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
  .msg { text-align: center; font-size: 18px; }
</style>
</head>
<body>
<div class="msg" id="msg">⚖️ טוען את האפליקציה...</div>
<script>
// index.html טוען את קוד האפליקציה (base64 של gzip של site.html) ומפענח אותו.
// מ-26.10.2026 הקוד מגיע בפרוסות app.b64.part-NN.txt לפי app.manifest.json ({parts, sha256}),
// שמתפרסמות ל-main דרך ענף build-*-app ופעולת publish-build. אם אין manifest, או שטעינת
// הפרוסות נכשלת, נטענים ארבעת הקבצים הישנים app.part0.txt עד app.part3.txt.
(async function () {
  async function fetchText(name) {
    var resp = await fetch(name, { cache: 'no-store' });
    if (!resp.ok) throw new Error('HTTP ' + resp.status + ' on ' + name);
    return resp.text();
  }
  async function sha256hex(text) {
    var buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
    return Array.from(new Uint8Array(buf)).map(function (b) { return ('0' + b.toString(16)).slice(-2); }).join('');
  }
  async function loadFromManifest() {
    var m = JSON.parse(await fetchText('app.manifest.json'));
    if (!m || !(m.parts > 0)) throw new Error('bad manifest');
    var b64 = '';
    for (var i = 0; i < m.parts; i++) {
      b64 += (await fetchText('app.b64.part-' + ('0' + i).slice(-2) + '.txt')).trim();
    }
    if (m.sha256 && (await sha256hex(b64)) !== m.sha256) throw new Error('sha256 mismatch');
    return b64;
  }
  async function loadLegacy() {
    var parts = ['app.part0.txt','app.part1.txt','app.part2.txt','app.part3.txt'];
    var b64 = '';
    for (var i = 0; i < parts.length; i++) b64 += (await fetchText(parts[i])).trim();
    return b64;
  }
  try {
    var b64;
    try {
      b64 = await loadFromManifest();
      window.__appSource = 'manifest';
    } catch (e1) {
      console.warn('manifest path unavailable, falling back to app.part0..3:', e1.message);
      b64 = await loadLegacy();
      window.__appSource = 'legacy';
    }
    var bin = atob(b64);
    var bytes = new Uint8Array(bin.length);
    for (var j = 0; j < bin.length; j++) bytes[j] = bin.charCodeAt(j);
    var ds = new DecompressionStream('gzip');
    var buf = await new Response(new Response(bytes).body.pipeThrough(ds)).arrayBuffer();
    var html = new TextDecoder().decode(buf);
    document.open();
    document.write(html);
    document.close();
  } catch (e) {
    document.getElementById('msg').textContent = 'שגיאה בטעינת האפליקציה: ' + e.message + ' — נסה לרענן';
  }
})();
</script>
</body>
</html>

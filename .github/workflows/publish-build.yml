# פרסום אוטומטי של נתוני אתר הגיבוי (דאשבורד התיקים)
# הסנכרון הלילי דוחף לענף build-* את הפרוסות data.enc.part-NN.txt (עד 10,000 תווים כל אחת,
# כי קובץ מלא של כ-50,000 תווים אינו עובר בנאמנות בקריאה אחת של push_files) ואת data.enc.sha256
# (ה-sha256 של הקובץ המלא). הפעולה מאחה את הפרוסות ל-data.enc.txt, מאמתת שה-sha256 של החיבור
# זהה לזה שבקובץ ושהתוצאה היא JSON תקין עם שדות ההצפנה, ורק אז מעתיקה את data.enc.txt ל-main.
# שום קובץ אחר (index.html, app.part*.txt, tools) אינו מועתק. בסיום הענף נמחק.
name: publish-build
on:
  push:
    branches: ['build-**']
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: publish-build
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: איחוי הפרוסות, אימות והעתקת data.enc.txt ל-main
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          set -e
          git fetch origin "$BRANCH"
          changed=$(git diff --name-only main "origin/$BRANCH")
          echo "changed files: $changed"
          for f in $changed; do
            case "$f" in
              data.enc.txt|data.enc.sha256|data.enc.part-[0-9][0-9].txt) ;;
              *) echo "הענף משנה קובץ שאינו קובץ נתונים ($f); לא מפורסם אוטומטית"; exit 1 ;;
            esac
          done
          if [ -z "$changed" ]; then echo "אין שינוי"; exit 0; fi
          parts=$(git ls-tree --name-only "origin/$BRANCH" | grep -E '^data\.enc\.part-[0-9]{2}\.txt$' | sort || true)
          if [ -n "$parts" ]; then
            echo "concatenating parts: $parts"
            : > data.enc.txt
            for p in $parts; do git show "origin/$BRANCH:$p" | tr -d '\r\n' >> data.enc.txt; done
          else
            git checkout "origin/$BRANCH" -- data.enc.txt
          fi
          if git cat-file -e "origin/$BRANCH:data.enc.sha256" 2>/dev/null; then
            expected=$(git show "origin/$BRANCH:data.enc.sha256" | tr -d ' \r\n')
            actual=$(sha256sum data.enc.txt | cut -d' ' -f1)
            echo "expected sha256: $expected"; echo "actual sha256:   $actual"
            [ "$expected" = "$actual" ] || { echo "ה-sha256 של החיבור אינו תואם ל-data.enc.sha256; לא מפורסם"; exit 1; }
          else
            echo "אזהרה: אין data.enc.sha256 בענף, מפורסם בלי אימות sha256"
          fi
          python3 - <<'PY'
          import json, sys
          d = json.load(open('data.enc.txt', encoding='utf-8'))
          for k in ('salt', 'iv', 'ct', 'iters', 'exportedAt'):
              if k not in d: print('חסר שדה', k); sys.exit(1)
          if len(d['ct']) < 20000: print('ct קצר מדי:', len(d['ct'])); sys.exit(1)
          print('data.enc.txt תקין, exportedAt', d['exportedAt'], ', ct', len(d['ct']), 'תווים')
          PY
          echo "data.enc.txt blob sha: $(git hash-object data.enc.txt), $(wc -c < data.enc.txt) bytes"
          git config user.name "tikim-dashboard publish"
          git config user.email "noreply@github.com"
          git add -A -- data.enc.txt
          if git diff --cached --quiet; then echo "אין שינוי מול main"; exit 0; fi
          git commit -m "פרסום נתונים מ-$BRANCH"
          git push origin HEAD:main
      - name: סגירת PR (אם נפתח) ומחיקת הענף
        env:
          BRANCH: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          for n in $(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number'); do
            gh pr close "$n" --comment "פורסם אוטומטית ל-main" || true
          done
          git push origin --delete "$BRANCH" || true
